name: Minimal HIL Flash

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull Zephyr build container
        run: |
          docker pull ghcr.io/zephyrproject-rtos/zephyr-build:latest

      - name: Build firmware inside container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            -w /work \
            ghcr.io/zephyrproject-rtos/zephyr-build:latest \
            bash -c "
              pip install pyelftools &&
              west init -m https://github.com/zephyrproject-rtos/zephyr --mr v3.5.0 &&
              west update &&
              west build -b nucleo_f411re app
            "

      - name: Prepare SSH key
        run: |
          echo "${{ secrets.PI_SSH_KEY }}" > key
          chmod 600 key

      - name: Create HIL directory on Pi
        run: |
          ssh -i key -o StrictHostKeyChecking=no \
            ${{ secrets.PI_USER }}@${{ secrets.PI_IP }} \
            "mkdir -p /home/kris/hil"

      - name: Upload flash script
        run: |
          scp -i key -o StrictHostKeyChecking=no \
            hil/flash.sh \
            ${{ secrets.PI_USER }}@${{ secrets.PI_IP }}:/home/kris/hil/flash.sh

          ssh -i key -o StrictHostKeyChecking=no \
            ${{ secrets.PI_USER }}@${{ secrets.PI_IP }} \
            "chmod +x /home/kris/hil/flash.sh"

      - name: Upload firmware
        run: |
          scp -i key -o StrictHostKeyChecking=no \
            zephyrproject/build/zephyr/zephyr.bin \
            ${{ secrets.PI_USER }}@${{ secrets.PI_IP }}:/home/kris/hil/firmware.bin

      - name: Flash firmware
        run: |
          ssh -i key -o StrictHostKeyChecking=no \
            ${{ secrets.PI_USER }}@${{ secrets.PI_IP }} \
            "/home/kris/hil/flash.sh"
