name: Minimal HIL Flash

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull Zephyr build container
        run: |
          docker pull ghcr.io/zephyrproject-rtos/zephyr-build:latest

      - name: Build firmware inside container
        run: |
          docker run --rm \
            -u root \
            -v ${{ github.workspace }}:/work \
            -w /work \
            ghcr.io/zephyrproject-rtos/zephyr-build:latest \
            bash -c "
              pip install pyelftools &&
              
              # 1. Initialize the workspace cleanly without invalid arguments
              west init -m https://github.com --mr main &&
              
              # 2. Speed optimization: shallow clone only the required STM32 modules
              west update --narrow --fetch-opt=--depth=1 cmsis hal_stm32 &&
              
              # 3. Compile the blinky sample for your target
              west build -b nucleo_f030r8/stm32f030x8 zephyr/samples/basic/blinky --pristine
              "

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nucleo-f030r8-blinky-bin
          path: |
            ${{ github.workspace }}/build/zephyr/zephyr.bin
            ${{ github.workspace }}/build/zephyr/zephyr.elf
          if-no-files-found: error

      - name: Trigger Local Webhook
        if: success()
        run: |
          curl -X POST http://YOUR_LOCAL_IP:5000/webhook \
            -H "Content-Type: application/json" \
            -d '{"repo": "${{ github.repository }}", "run_id": "${{ github.run_id }}"}'
