name: Minimal HIL Flash

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Run the entire job inside the official Zephyr container instead of running slow custom docker commands
    container:
      image: ghcr.io/zephyrproject-rtos/zephyr-build:latest
      options: --user root

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: app # Places your source directory files inside an isolated 'app' subfolder

      - name: Initialize West Workspace
        run: |
          west init -m app
          west update

      - name: Build Firmware Inside Container
        run: |
          # Targeting your exact nucleo_f030r8 board combined with the required C-04 12MHz hardware clock flag
          west build -b nucleo_f030r8/stm32f030x8 app --pristine -- -DCONFIG_STM32_HSE_BYPASS_CLOCK=12000000

      - name: Upload Flashable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zephyr-hex-artifact
          path: |
            build/zephyr/zephyr.hex
            build/zephyr/zephyr.bin
            build/zephyr/zephyr.elf
          if-no-files-found: error
          retention-days: 7
