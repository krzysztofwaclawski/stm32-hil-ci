name: Minimal HIL Flash

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zephyrproject-rtos/zephyr-build:latest
      options: --user root

    steps:
      - name: Replicate Local Zephyr Workspace Layout
        run: |
          # 1. Initialize the cloud workspace pointing directly to the official upstream Zephyr mirror
          west init -m https://github.com --mr main workspace
          cd workspace
          
          # 2. Pull down the core hardware abstraction layers and system frameworks
          west update
          
          # 3. Build the standard built-in Blinky sample with your C-04 12MHz hardware clock override
          west build -b nucleo_f030r8/stm32f030x8 zephyr/samples/basic/blinky --pristine -- -DCONFIG_STM32_HSE_BYPASS_CLOCK=12000000

      - name: Upload Flashable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zephyr-hex-artifact
          path: |
            workspace/build/zephyr/zephyr.hex
            workspace/build/zephyr/zephyr.bin
            workspace/build/zephyr/zephyr.elf
          if-no-files-found: error
          retention-days: 7
