name: Minimal HIL Flash

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space for Large Docker Image
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          
          # Remove massive pre-installed toolchains we don't need
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          
          # Clean up apt caches and docker system data
          sudo apt-get clean
          docker system prune -af --volumes
          
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Build firmware inside container
        run: |
          docker run --rm \
            -u root \
            --entrypoint /bin/bash \
            -v ${{ github.workspace }}:/work \
            -w /work \
            ghcr.io/zephyrproject-rtos/zephyr-build:latest \
            -c "
              # 1. Initialize Zephyr manifest workspace in a clean subdirectory
              west init -m https://github.com/zephyrproject-rtos/zephyr --mr main zephyr-project &&
              cd zephyr-project &&
              
              # 2. Synchronize required project dependencies
              west update --narrow --fetch-opt=--depth=1 &&
              
              # 3. Compile the blinky sample for your target board
              west build -b nucleo_f030r8 zephyr/samples/basic/blinky --pristine
              "

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nucleo-f030r8-blinky-bin
          path: |
            ${{ github.workspace }}/zephyr-project/build/zephyr/zephyr.bin
            ${{ github.workspace }}/zephyr-project/build/zephyr/zephyr.elf
          if-no-files-found: error

      - name: Trigger Local Webhook
        if: success()
        run: |
          curl -X POST http://YOUR_LOCAL_IP:5000/webhook \
            -H "Content-Type: application/json" \
            -d "{\"repo\": \"${{ github.repository }}\", \"run_id\": \"${{ github.run_id }}\"}"
