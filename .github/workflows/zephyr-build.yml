name: Build Zephyr Blinky

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zephyrproject-rtos/ci:v0.27.4  # Matches Zephyr's official SDK environment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: app

      - name: Initialize West workspace
        run: |
          west init -m https://github.com --mr main zephyrproject
          cd zephyrproject
          west update
          west zephyr-export

      - name: Build Blinky Sample
        run: |
          cd zephyrproject
          west build -b nucleo_f030r8/stm32f030x8 zephyr/samples/basic/blinky --pristine

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blinky-nucleo-firmware
          path: zephyrproject/build/zephyr/zephyr.bin
